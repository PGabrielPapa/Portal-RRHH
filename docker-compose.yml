# Portal RR.HH. — stack de desarrollo: Postgres + API.
# Uso:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    container_name: portal_db
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_rrhh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_rrhh"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: portal_api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://portal:portal@db:5432/portal_rrhh
      JWT_SECRET: cambiar-este-secreto-en-produccion
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: 10
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # En dev: aplica esquema + seed (idempotentes) y arranca la API.
    command: sh -c "node src/db/migrate.js && node src/db/seed.js && node src/server.js"

  web:
    build: ./frontend
    container_name: portal_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
